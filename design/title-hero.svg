<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="640" height="440" role="img" aria-label="A radio tower on a hill at night sending signal rings to three houses">
<!-- Iris: title hero for Signal Tower. Inline this SVG in #screen-title. Animated with CSS; reduced-motion fallback included. -->
<style>
.waves circle { transform-box: view-box; transform-origin: 160px 58px; animation: hero-wave 3s linear infinite; opacity: 0; }
.waves circle:nth-child(2) { animation-delay: 1s; }
.waves circle:nth-child(3) { animation-delay: 2s; }
@keyframes hero-wave { 0% { transform: scale(0.4); opacity: 0.8; } 100% { transform: scale(6.5); opacity: 0; } }
.beacon { animation: hero-blink 1.2s ease-in-out infinite alternate; }
@keyframes hero-blink { from { opacity: 0.55; } to { opacity: 1; } }
.star { animation: hero-twinkle 3.2s ease-in-out infinite alternate; }
.star.sb { animation-duration: 2.6s; animation-delay: 0.7s; }
.star.sc { animation-duration: 4s; animation-delay: 1.4s; }
@keyframes hero-twinkle { from { opacity: 0.2; } to { opacity: 0.7; } }
.h .win { animation: hero-lamp 6s steps(1, end) infinite; }
.h2 .win { animation-delay: 0.35s; }
.h3 .win { animation-delay: 0.7s; }
@keyframes hero-lamp { 0% { fill: #3a4552; } 12% { fill: #ffd27a; } 88% { fill: #ffd27a; } 96% { fill: #3a4552; } }
.links { animation: hero-links 6s ease-in-out infinite; }
@keyframes hero-links { 0%, 10% { opacity: 0; } 22%, 86% { opacity: 0.55; } 96%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .waves circle, .beacon, .star, .h .win, .links { animation: none; }
  .waves circle { opacity: 0.35; transform: scale(2.5); }
  .h .win { fill: #ffd27a; }
  .links { opacity: 0.55; }
}
</style>
<rect width="320" height="220" fill="#1b232d"/>
<defs>
  <radialGradient id="hero-glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#7fe0d0" stop-opacity="0.18"/><stop offset="1" stop-color="#7fe0d0" stop-opacity="0"/></radialGradient>
  <linearGradient id="hero-fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b232d" stop-opacity="0"/><stop offset="1" stop-color="#1b232d" stop-opacity="1"/></linearGradient>
</defs>
