<g opacity="0.3" transform="translate(184 406) scale(0.36)"><circle cx="50" cy="50" r="30" fill="none" stroke="#e9edf1" stroke-width="3" stroke-dasharray="6 6"/></g></g><text x="346" y="210" font-family="ui-rounded, system-ui, -apple-system, sans-serif" font-size="9" fill="#e9edf1" text-anchor="start">Bounce, shown three ways:</text><text x="346" y="228" font-family="ui-rounded, system-ui, -apple-system, sans-serif" font-size="9" fill="#9aa7b5" text-anchor="start">1. Panel glints when a tower sees it.</text><text x="346" y="244" font-family="ui-rounded, system-ui, -apple-system, sans-serif" font-size="9" fill="#9aa7b5" text-anchor="start">2. Reflected tiles get the normal teal</text><text x="346" y="256" font-family="ui-rounded, system-ui, -apple-system, sans-serif" font-size="9" fill="#9aa7b5" text-anchor="start">   tint; waves start at the panel.</text><text x="346" y="272" font-family="ui-rounded, system-ui, -apple-system, sans-serif" font-size="9" fill="#9aa7b5" text-anchor="start">3. House links bend at the panel</text><text x="346" y="284" font-family="ui-rounded, system-ui, -apple-system, sans-serif" font-size="9" fill="#9aa7b5" text-anchor="start">   (tower to panel to house).</text><text x="346" y="302" font-family="ui-rounded, system-ui, -apple-system, sans-serif" font-size="9" fill="#9aa7b5" text-anchor="start">Preview only: faint dashed ring around</text><text x="346" y="314" font-family="ui-rounded, system-ui, -apple-system, sans-serif" font-size="9" fill="#9aa7b5" text-anchor="start">the mirror-image point (just below the board here).</text><text x="346" y="332" font-family="ui-rounded, system-ui, -apple-system, sans-serif" font-size="9" fill="#9aa7b5" text-anchor="start">Range counts the whole bent path.</text><text x="346" y="350" font-family="ui-rounded, system-ui, -apple-system, sans-serif" font-size="9" fill="#9aa7b5" text-anchor="start">Sketch uses reach 4 so the bounce shows.</text>
